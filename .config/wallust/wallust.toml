backend = "wal"
color_space = "lab"
palette = "harddark"
generation = "interpolate"

[templates]
hyprland = { src = 'hyprland.lua', dst = '~/.config/hypr/hyprland/colors.lua'}
ghostty = { src = 'colors.css', dst = '~/.config/ghostty/colors.css'}
rofi = {src = 'colors-rofi.rasi', dst = '~/.config/rofi/themes/colors-rofi.rasi'}
rofi-power = {src = 'colors-power.rasi', dst = '~/.config/rofi/themes/powermenu/colors-power.rasi'}
firefox = {src= 'colors.json', dst = '~/.cache/wal/colors.json'}
gtk3 = {src='gtk.css', dst='~/.config/gtk-3.0/gtk.css'}
gtk4 = {src='gtk.css', dst='~/.config/gtk-4.0/gtk.css'}
quickshell = {src='quickshell.qml', dst='~/.config/quickshell/common/Colors.qml'}

[hooks]
notif = 'notify-send "New Scheme Generated!"'
